<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar Autor - Generica</title>
</head>
<body>
    <h1>Eliminar Autor (Vista Generica)</h1>
    <p>Esta seguro de eliminar al autor: <strong>{{ autor.nombre }}</strong>?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Si, eliminar</button>
        <a href="{% url 'lista_autores_generica' %}">Cancelar</a>
    </form>
</body>
</html>
