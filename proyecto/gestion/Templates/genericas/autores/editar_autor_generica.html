<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Autor - Generica</title>
</head>
<body>
    <h1>Editar Autor (Vista Generica)</h1>

    <form method="post">
        {% csrf_token %}
        <table>
            {{ form.as_table }}
        </table>
        <br>
        <button type="submit">Guardar cambios</button>
    </form>

    <br>
    <a href="{% url 'lista_autores_generica' %}">Volver a la lista generica</a>
</body>
</html>
