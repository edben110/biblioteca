<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Autor</title>
</head>
<body>
    <h1>Crear Autor</h1>

    <form method="post">
        {% csrf_token %}
        <table>
            {{ form.as_table }}
        </table>
        <br>
        <button type="submit">Guardar</button>
    </form>

    <br>
    <a href="{% url 'lista_autores' %}">Volver a la lista</a>
</body>
</html>
